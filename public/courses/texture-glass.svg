<svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" />
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <linearGradient id="glass-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F2F5"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#glass-gradient)"/>
  <circle cx="50%" cy="50%" r="200" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
  <path d="M0 0 L800 600" stroke="rgba(255,255,255,0.8)" stroke-width="2" opacity="0.5"/>
  <path d="M800 0 L0 600" stroke="rgba(255,255,255,0.8)" stroke-width="2" opacity="0.5"/>
  <rect x="100" y="100" width="600" height="400" fill="none" stroke="rgba(0,0,0,0.03)" stroke-width="1"/>
</svg>