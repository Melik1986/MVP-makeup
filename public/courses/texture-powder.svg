<svg width="100%" height="100%" viewBox="0 0 800 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="skin-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#EADED2"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#skin-gradient)"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.15"/>
  <circle cx="80%" cy="20%" r="300" fill="#FFFFFF" fill-opacity="0.3" filter="blur(60px)"/>
  <circle cx="20%" cy="80%" r="200" fill="#EADED2" fill-opacity="0.4" filter="blur(40px)"/>
</svg>